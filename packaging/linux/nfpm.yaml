name: bearcat-desktop
arch: amd64
platform: linux
version: ${BEARCAT_VERSION}
section: net
priority: optional
maintainer: gizmo93
description: Desktop launcher for Bearcat, including the Bearcat host.
homepage: https://github.com/gizmo93/Bearcat
license: MIT

contents:
  - src: artifacts/desktop/linux-x64
    dst: /opt/bearcat-desktop
    type: tree

  - src: packaging/linux/bearcat-desktop.desktop
    dst: /usr/share/applications/bearcat-desktop.desktop
    file_info:
      mode: 0644

overrides:
  deb:
    depends:
      - libx11-6
      - libice6
      - libsm6
      - libfontconfig1
  rpm:
    depends:
      - libX11
      - libICE
      - libSM
      - fontconfig
