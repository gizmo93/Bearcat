services:
  bearcat:
    image: ${BEARCAT_IMAGE:-ghcr.io/gizmo93/bearcat:latest}
    # Bearcat is published as amd64 because the bundled RAR binary is only available for x64 Linux.
    platform: linux/amd64
    container_name: bearcat
    ports:
      - "${BEARCAT_PORT:-8080}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - WorkingDirectories__0=/mnt/data/releases
      - Bearcat__DataDirectory=/data
      # The SQLite database file is stored in the data directory as bearcat.db.
      # Use docker-compose.postgres.yml to run Bearcat with PostgreSQL instead.
      - Database__Provider=Sqlite
      - Bearcat__ApiKey=${BEARCAT_API_KEY:-}
      - LocalTimezone=${BEARCAT_TIMEZONE:-}
    volumes:
      - ${BEARCAT_DATA_DIR:-./bearcat-data}:/data
      - ${RELEASES_DIR}:/mnt/data/releases
    networks:
      - bearcat-network
    restart: unless-stopped
    mem_reservation: 200m
    mem_limit: ${BEARCAT_MEMORY_LIMIT:-512m}
    cpus: ${BEARCAT_CPU_LIMIT:-0.5}
    memswap_limit: 0m

networks:
  bearcat-network:
    driver: bridge
