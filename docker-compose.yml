services:
  bearcat:
    image: ${BEARCAT_IMAGE:-ghcr.io/gizmo93/bearcat:latest}
    # Bearcat is published as amd64 because the bundled RAR binary is only available for x64 Linux.
    platform: linux/amd64
    container_name: bearcat
    ports:
      - "${BEARCAT_PORT:-8080}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ReleaseDataDirectory=/mnt/data
      - Bearcat__DataDirectory=/data
      - Database__ConnectionString=Host=postgres;Database=${POSTGRES_DB:-bearcat};Username=${POSTGRES_USER:-bearcat};Password=${POSTGRES_PASSWORD:-bearcat123}
    volumes:
      - ${BEARCAT_DATA_DIR:-./bearcat-data}:/data
      - ${RELEASES_DIR}:/mnt/data/releases
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bearcat-network
    restart: unless-stopped
    mem_reservation: 200m
    mem_limit: ${BEARCAT_MEMORY_LIMIT:-512m}
    cpus: ${BEARCAT_CPU_LIMIT:-0.5}
    memswap_limit: 0m

  postgres:
    image: postgres:18-alpine
    container_name: bearcat-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-bearcat}
      - POSTGRES_USER=${POSTGRES_USER:-bearcat}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-bearcat123}
    volumes:
      - ${POSTGRES_DATA_DIR:-./postgres-data}:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - bearcat-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bearcat} -d ${POSTGRES_DB:-bearcat}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_reservation: 200m
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-512m}
    cpus: ${POSTGRES_CPU_LIMIT:-0.5}
    memswap_limit: 0m

networks:
  bearcat-network:
    driver: bridge
